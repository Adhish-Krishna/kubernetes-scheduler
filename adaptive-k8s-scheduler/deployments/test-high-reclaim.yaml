apiVersion: apps/v1
kind: Deployment
metadata:
  name: idle-batch-worker
  namespace: ecommerce
spec:
  replicas: 2
  selector:
    matchLabels:
      app: idle-batch-worker
  template:
    metadata:
      labels:
        app: idle-batch-worker
      annotations:
        reclaim.io/checkpointable: "true"
    spec:
      schedulerName: adaptive-scheduler
      containers:
        - name: batch-worker
          image: alpine:3.20
          command: ["/bin/sh", "-c", "exec sleep 86400"]
          resources:
            requests:
              cpu: "1000m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
