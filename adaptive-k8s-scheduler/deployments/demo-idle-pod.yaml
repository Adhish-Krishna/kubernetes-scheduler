apiVersion: v1
kind: Pod
metadata:
  name: idle-checkpoint-demo
  namespace: ecommerce
  labels:
    app: idle-checkpoint-demo
    reclaim.io/demo: "true"
  annotations:
    reclaim.io/checkpointable: "true"
    reclaim.io/demo-purpose: "idle workload for checkpoint and reclamation demo"
spec:
  schedulerName: adaptive-scheduler
  restartPolicy: Never
  containers:
    - name: idle-worker
      image: alpine:3.20
      command: ["/bin/sh", "-c", "exec sleep 86400"]
      resources:
        requests:
          cpu: "500m"
          memory: "256Mi"
        limits:
          cpu: "1000m"
          memory: "512Mi"
